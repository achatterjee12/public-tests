name: Library catalog probe
# Temporary diagnostic for the multi-library work; deleted before merge.
on:
  workflow_dispatch:
  push:
    paths:
      - library-new-item-tracker/probe.py
      - .github/workflows/library-probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - working-directory: library-new-item-tracker
        run: python probe.py
