name: PS5 tracker

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write           # to commit the updated database

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog
        working-directory: ps5_tracker
        run: python tracker.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save database
        run: |
          git config user.name "ps5-tracker"
          git config user.email "ps5-tracker@users.noreply.github.com"
          git add -f ps5_tracker/ps5_games.db
          git diff --cached --quiet || (git commit -m "Update PS5 game database" && git push)
