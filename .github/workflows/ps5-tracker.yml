name: PS5 tracker

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 14:17 UTC
  workflow_dispatch:
    inputs:
      send_test:
        description: Also send a test notification (checks the phone end)
        type: boolean
        default: false

permissions:
  contents: write           # to commit the updated database

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send test notification
        if: ${{ inputs.send_test }}
        working-directory: library-new-item-tracker
        env:
          NTFY_TOPIC: ${{ secrets.LIBRARY_NEW_ITEM_TRACKER_NTFY_TOPIC }}
        run: ./notify.sh test
      - name: Check catalog
        working-directory: library-new-item-tracker
        shell: bash   # explicit shell turns on pipefail, so a tracker.py crash fails the step
        env:
          PS5_NEW_FILE: ${{ runner.temp }}/new_games.txt
        run: python tracker.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save database
        run: |
          git config user.name "ps5-tracker"
          git config user.email "ps5-tracker@users.noreply.github.com"
          git add -f library-new-item-tracker/ps5_games.db library-new-item-tracker/games.json
          git diff --cached --quiet || (git commit -m "Update PS5 game database and page data" && git push)
      # ntfy topic comes from the LIBRARY_NEW_ITEM_TRACKER_NTFY_TOPIC repository secret (this repo is public, so the
      # topic name must not be written in any file). Notifications are skipped if it is unset.
      - name: Notify about new games
        working-directory: library-new-item-tracker
        env:
          NTFY_TOPIC: ${{ secrets.LIBRARY_NEW_ITEM_TRACKER_NTFY_TOPIC }}
        run: ./notify.sh new "${{ runner.temp }}/new_games.txt"
      - name: Notify on failure
        if: failure()
        working-directory: library-new-item-tracker
        env:
          NTFY_TOPIC: ${{ secrets.LIBRARY_NEW_ITEM_TRACKER_NTFY_TOPIC }}
        run: ./notify.sh failure "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
