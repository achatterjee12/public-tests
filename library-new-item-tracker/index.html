<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New PS5 Games · Mountain View Library</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f27; --muted: #667085;
    --line: #e4e7ec; --accent: #1d4ed8; --badge-bg: #dcfce7; --badge-fg: #166534;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --card: #181c25; --text: #e8eaef; --muted: #98a1b3;
      --line: #2a3040; --accent: #7aa2ff; --badge-bg: #14351f; --badge-fg: #86efac;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  .home { display: inline-block; margin-bottom: 14px; font-size: .9rem; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  section { margin-bottom: 28px; }
  h2 {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 1.1rem; margin: 0 0 10px;
  }
  .count { color: var(--muted); font-weight: 400; font-size: .95rem; }
  ul { list-style: none; margin: 0; padding: 0;
       background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 12px;
       padding: 12px 16px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  a { color: var(--accent); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
  .when { color: var(--muted); font-size: .85rem; white-space: nowrap; text-align: right; }
  .badge { background: var(--badge-bg); color: var(--badge-fg); font-size: .7rem;
           font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-left: 8px;
           vertical-align: 1px; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 10px;
           padding: 18px 16px; color: var(--muted); }
  footer { color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line);
           padding-top: 16px; }
  footer p { margin: 0 0 6px; }
  #error { color: #b42318; }
  @media (max-width: 480px) { li { flex-direction: column; align-items: flex-start; gap: 2px; } .when { text-align: left; } }
</style>
</head>
<body>
<main>
  <a class="home" href="../">← Home</a>
  <h1>New PS5 games</h1>
  <p class="sub">Mountain View Public Library catalog</p>

  <p id="error" hidden></p>

  <section>
    <h2>Last 24 hours <span class="count" id="count-day"></span></h2>
    <div id="day"></div>
  </section>

  <section>
    <h2>Last 7 days <span class="count" id="count-week"></span></h2>
    <div id="week"></div>
  </section>

  <footer>
    <p id="status">Loading…</p>
    <p>The catalog does not publish when an item was added, so a game's "added" time is
       when this tracker first saw it. The tracker checks once a day, so times are accurate
       to within about a day.</p>
  </footer>
</main>

<script>
const DAY = 24 * 60 * 60 * 1000;
const el = id => document.getElementById(id);

function ago(ms) {
  const h = Math.floor(ms / 3600000);
  if (h < 1) return "just now";
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.floor(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}

function render(target, items, now, showBadge) {
  const box = el(target);
  box.replaceChildren();
  if (!items.length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "No new PS5 games in this period.";
    box.append(p);
    return;
  }
  const ul = document.createElement("ul");
  for (const it of items) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.textContent = it.title;
    a.href = it.url;
    a.target = "_blank";
    a.rel = "noopener";
    const left = document.createElement("span");
    left.append(a);
    const age = now - new Date(it.added).getTime();
    if (showBadge && age <= DAY) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = "NEW";
      left.append(b);
    }
    const when = document.createElement("span");
    when.className = "when";
    const t = new Date(it.added);
    when.textContent = ago(age) + " · " + t.toLocaleString(undefined,
      { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    li.append(left, when);
    ul.append(li);
  }
  box.append(ul);
}

fetch("games.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => {
    const now = Date.now();
    // baseline = the catalog snapshot from the first run, not genuinely new
    const fresh = data.items.filter(i => !i.baseline)
      .map(i => ({ ...i, t: new Date(i.added).getTime() }))
      .sort((a, b) => b.t - a.t);
    const day = fresh.filter(i => now - i.t <= DAY);
    const week = fresh.filter(i => now - i.t <= 7 * DAY);
    render("day", day, now, false);
    render("week", week, now, true);
    el("count-day").textContent = day.length + (day.length === 1 ? " game" : " games");
    el("count-week").textContent = week.length + (week.length === 1 ? " game" : " games");
    const base = data.items.find(i => i.baseline);
    el("status").textContent =
      "Tracking " + data.total + " PS5 games. Last checked " +
      new Date(data.generated_at).toLocaleString() +
      (base ? "; tracking since " + new Date(base.added).toLocaleDateString() + "." : ".");
  })
  .catch(err => {
    el("error").hidden = false;
    el("error").textContent = "Could not load games.json (" + err.message + ").";
    el("status").textContent = "";
  });
</script>
</body>
</html>
