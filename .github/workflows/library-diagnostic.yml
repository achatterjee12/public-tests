name: Library diagnostic
# Temporary: runs the real fetchers and a dry-run of the tracker on GitHub's network.
# Deleted before merge.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/library-diagnostic.yml
      - library-new-item-tracker/**
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tracker dry run (one full daily run, with the request spacing)
        working-directory: library-new-item-tracker
        shell: bash
        env:
          PS5_DB: ${{ runner.temp }}/dry.db
          PS5_JSON: ${{ runner.temp }}/dry.json
          PS5_NEW_FILE: ${{ runner.temp }}/dry_new.txt
        run: |
          cp ps5_games.db "$PS5_DB"
          summarize() {
            python - <<'PY'
          import json, os, collections
          d = json.load(open(os.environ["PS5_JSON"]))
          print("libraries:", [(l["name"], l["total"]) for l in d["libraries"]])
          by = collections.Counter(i["library"] for i in d["items"] if i["branches"])
          print("items with branches:", dict(by))
          ex = [i for i in d["items"] if i["library"] == "sccl" and i["branches"]][:2]
          print("example:", [(i["title"], i["branches"]) for i in ex])
          ed = collections.Counter(i["title"] for i in d["items"] if i["library"] == "sccl")
          print("sccl distinct titles:", len(ed), "of", sum(ed.values()))
          PY
          }
          echo "===== RUN 1"; time python tracker.py; summarize
          echo "--- notification message that would be sent:"
          cat "$PS5_NEW_FILE" 2>/dev/null || echo "(none: baselines are silent)"
