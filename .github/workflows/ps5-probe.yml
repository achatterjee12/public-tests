name: PS5 catalog probe

# One-off diagnostic. Loads the Mountain View Vega Discover catalog in a
# browser and records what it requests. Delete once catalog.py is written.
on:
  workflow_dispatch:
  push:
    paths:
      - ps5_tracker/probe.py
      - .github/workflows/ps5-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Fetcher diagnostic
        working-directory: ps5_tracker
        run: python catalog.py && PS5_DB=$RUNNER_TEMP/dry.db python tracker.py
      - name: Probe catalog
        working-directory: ps5_tracker
        run: python probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-output
          path: ps5_tracker/probe_out/
